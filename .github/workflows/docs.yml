name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages from Actions (CORELIB_PLAN §12.2:
# the native deployment, never a gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # Dokka renders the KDoc of every source set into build/dokka/html.
      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate

      # Reads the repository's Pages configuration; it does not create it.
      # CORELIB_PLAN §12.2 has the site enabled on the repository itself —
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions — and
      # the workflow's GITHUB_TOKEN is not permitted to create one, so asking it
      # to (`enablement: true`) fails the job on a repo where Pages is off.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
